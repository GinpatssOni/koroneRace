<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korone Fun Race</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ffcc00;
        }
        
        .score-container, .controls, .speed-container {
            font-size: 1.2rem;
        }
        
        .controls {
            text-align: center;
        }
        
        .speed-container {
            text-align: right;
            color: #ff6b6b;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: #0f3460;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 4px solid #ffcc00;
        }
        
        #road {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #1e272e;
        }
        
        .road-line {
            position: absolute;
            width: 10px;
            height: 50px;
            background: #ffcc00;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #car {
            position: absolute;
            width: 80px;
            height: 150px;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-image: url('gincar.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            transition: left 0.1s ease, transform 0.2s;
        }
        
        .car-tilt-left {
            transform: translateX(-50%) rotate(-10deg);
        }
        
        .car-tilt-right {
            transform: translateX(-50%) rotate(10deg);
        }
        
        .car-hit {
            animation: carHitEffect 0.3s;
        }
        
        @keyframes carHitEffect {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); }
        }
        
        /* Exhaust effect */
        .exhaust-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            z-index: 9;
            pointer-events: none;
        }
        
        .exhaust-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff9900;
            border-radius: 50%;
            bottom: 5px;
            opacity: 0;
            filter: blur(2px);
            animation: exhaustFloat 1s ease-out forwards;
        }
        
        @keyframes exhaustFloat {
            0% {
                opacity: 0.8;
                transform: translateY(0) scale(0.5);
            }
            50% {
                opacity: 0.5;
                transform: translateY(-20px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-40px) scale(0.2);
            }
        }
        
        /* Drift effect */
        .drift-effect {
            position: absolute;
            width: 20px;
            height: 40px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            opacity: 0.6;
            filter: blur(5px);
            z-index: 8;
            pointer-events: none;
        }
        
        /* Hit effect */
        .hit-effect {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,0,0,0.8) 0%, rgba(255,0,0,0) 70%);
            z-index: 12;
            pointer-events: none;
            opacity: 0;
            animation: hitPulse 0.5s;
        }
        
        @keyframes hitPulse {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(1.5); }
        }
        
        .target {
            position: absolute;
            width: 70px;
            height: 70px;
            background-image: url('koro-f.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 5;
            transition: transform 0.2s;
        }
        
        .target.hit {
            background-image: url('koro-fh.png');
            transform: scale(1.2);
        }
        
        .instructions {
            max-width: 800px;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        button {
            background: #ffcc00;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ffd633;
            transform: scale(1.05);
        }
        
        .pulse {
            animation: pulse 0.5s;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        
        .game-over h2 {
            font-size: 3rem;
            color: #ffcc00;
            margin-bottom: 20px;
        }
        
        .hidden {
            display: none;
        }
        
        .speed-bar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .speed-fill {
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #FFC107, #FF5722);
            width: 0%;
            transition: width 0.5s;
        }
        
        .progress-container {
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        /* Control buttons */
        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 15;
            pointer-events: none;
        }
        
        .control-buttons {
            display: flex;
            gap: 40px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 204, 0, 0.7);
            border: 3px solid white;
            color: #1a1a2e;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:active {
            background: rgba(255, 204, 0, 1);
            transform: scale(0.95);
        }
        
        /* Hide controls on larger screens by default, show on smaller screens */
        @media (min-width: 768px) {
            #controls-container {
                display: none;
            }
        }
        
        /* Show controls when explicitly enabled */
        .controls-visible #controls-container {
            display: flex;
        }
        
        /* Toggle button for controls */
        #toggle-controls {
            margin-top: 10px;
            background: #4CAF50;
            color: white;
        }
        
        #toggle-controls:hover {
            background: #45a049;
        }
        
        /* Sound controls */
        .sound-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }
        
        .sound-btn {
            background: #3498db;
            color: white;
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        
        .sound-btn:hover {
            background: #2980b9;
        }
        
        .sound-btn.muted {
            background: #e74c3c;
        }
        
        .sound-btn.muted:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <header>
        <h1>Korone Fun Race</h1>
    </header>
    
    <div class="game-info">
        <div class="score-container">
            Score: <span id="score">0</span>
        </div>
        <div class="controls">
            Use LEFT and RIGHT arrow keys to drive
        </div>
        <div class="speed-container">
            Speed: <span id="speed-level">1</span>x
        </div>
    </div>
    
    <div class="progress-container">
        <div class="progress-label">
            <span>Speed Progress</span>
            <span id="speed-percent">0%</span>
        </div>
        <div class="speed-bar">
            <div class="speed-fill" id="speed-fill"></div>
        </div>
    </div>
    
    <div id="game-container">
        <div id="road"></div>
        
        <!-- Car effects containers -->
        <div id="exhaust-container" class="exhaust-container"></div>
        <div id="car"></div>
        
        <!-- Control buttons -->
        <div id="controls-container">
            <div class="control-buttons">
                <button id="left-btn" class="control-btn">←</button>
                <button id="right-btn" class="control-btn">→</button>
            </div>
        </div>
        
        <div id="game-over" class="game-over hidden">
            <h2>Game Over!</h2>
            <p>Your final score: <span id="final-score">0</span></p>
            <p>Maximum speed reached: <span id="max-speed">1</span>x</p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>
    
    <div class="instructions">
        <p>Drive your car and hit as many targets as you can! Each hit gives you 10 points.</p>
        <p>The road will speed up over time - how long can you last?</p>
        <button id="start-btn">Start Game</button>
        <button id="toggle-controls">Show Controls</button>
        
        <div class="sound-controls">
            <button id="engine-sound-btn" class="sound-btn">Engine Sound: ON</button>
            <button id="effects-sound-btn" class="sound-btn">Effects: ON</button>
        </div>
    </div>

    <script>
        // Game elements
        const gameContainer = document.getElementById('game-container');
        const road = document.getElementById('road');
        const car = document.getElementById('car');
        const exhaustContainer = document.getElementById('exhaust-container');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const gameOverScreen = document.getElementById('game-over');
        const speedLevelElement = document.getElementById('speed-level');
        const speedFillElement = document.getElementById('speed-fill');
        const speedPercentElement = document.getElementById('speed-percent');
        const maxSpeedElement = document.getElementById('max-speed');
        
        // Control buttons
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const toggleControlsBtn = document.getElementById('toggle-controls');
        
        // Sound control buttons
        const engineSoundBtn = document.getElementById('engine-sound-btn');
        const effectsSoundBtn = document.getElementById('effects-sound-btn');
        
        // Game state
        let score = 0;
        let gameActive = false;
        let carPosition = 50; // percentage from left
        let targets = [];
        let gameTimer;
        let targetSpawnInterval;
        let roadAnimation;
        let exhaustInterval;
        
        // Button control variables
        let moveLeft = false;
        let moveRight = false;
        
        // Car state for effects
        let carMoving = false;
        let lastCarPosition = 50;
        let lastDirection = 'none';
        let driftEffectActive = false;
        
        // Speed system
        let currentSpeed = 1;
        let maxSpeed = 10;
        let speedIncreaseInterval;
        let speedProgress = 0;
        let speedIncreaseRate = 0.5;
        
        // Sound system
        let engineSoundEnabled = true;
        let effectsSoundEnabled = true;
        let engineSound;
        let driftSound;
        let crashSound;
        let hitSound;
        
        // Initialize sounds
        function initSounds() {
            // Engine sound (loop)
            engineSound = new Audio('engine-47745.mp3');
            engineSound.loop = true;
            engineSound.volume = 0.3;
            
            // Drift sound
            driftSound = new Audio('drift.mp3');
            driftSound.volume = 0.1;
            
            // Crash sound for car
            crashSound = new Audio('car-crash-sound-376882.mp3');
            crashSound.volume = 0.2;
            
            // Target hit sound
            hitSound = new Audio('kuri.mp3');
            hitSound.volume = 0.5;
        }
        
        // Create road markings
        function createRoadMarkings() {
            road.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const line = document.createElement('div');
                line.className = 'road-line';
                line.style.top = `${i * 100}px`;
                road.appendChild(line);
            }
        }
        
        // Move car
        function moveCar(direction) {
            if (!gameActive) return;
            
            // Remove any existing tilt classes
            car.classList.remove('car-tilt-left', 'car-tilt-right');
            
            if (direction === 'left' && carPosition > 10) {
                carPosition -= 5;
                car.classList.add('car-tilt-left');
                lastDirection = 'left';
            } else if (direction === 'right' && carPosition < 90) {
                carPosition += 5;
                car.classList.add('car-tilt-right');
                lastDirection = 'right';
            }
            
            car.style.left = `${carPosition}%`;
            carMoving = true;
            
            // Check for drift effect (quick direction change)
            const positionChange = Math.abs(carPosition - lastCarPosition);
            if (positionChange > 2 && !driftEffectActive) {
                createDriftEffect();
            }
            
            lastCarPosition = carPosition;
        }
        
        // Create exhaust particles
        function createExhaust() {
            if (!gameActive || !carMoving) return;
            
            const particle = document.createElement('div');
            particle.className = 'exhaust-particle';
            
            // Position at car's exhaust (back of car)
            const carRect = car.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            
            // Random position at back of car
            const offsetX = (Math.random() * 20) - 10;
            particle.style.left = `${50 + offsetX}%`;
            
            exhaustContainer.appendChild(particle);
            
            // Remove particle after animation
            setTimeout(() => {
                if (particle.parentNode) {
                    particle.remove();
                }
            }, 1000);
        }
        
        // Create drift effect
        function createDriftEffect() {
            if (!effectsSoundEnabled) return;
            
            driftEffectActive = true;
            
            // Play drift sound
            if (effectsSoundEnabled) {
                driftSound.currentTime = 0;
                driftSound.play().catch(e => console.log("Drift sound error:", e));
            }
            
            // Create visual drift effect
            const drift = document.createElement('div');
            drift.className = 'drift-effect';
            
            // Position at side of car based on direction
            if (lastDirection === 'left') {
                drift.style.left = `${carPosition + 4}%`;
                drift.style.background = 'rgba(255, 100, 100, 0.7)';
            } else {
                drift.style.left = `${carPosition - 4}%`;
                drift.style.background = 'rgba(100, 100, 255, 0.7)';
            }
            
            drift.style.bottom = '20px';
            gameContainer.appendChild(drift);
            
            // Remove after animation
            setTimeout(() => {
                if (drift.parentNode) {
                    drift.remove();
                }
                driftEffectActive = false;
            }, 500);
        }
        
        // Create hit effect on car
        function createHitEffect() {
            const hitEffect = document.createElement('div');
            hitEffect.className = 'hit-effect';
            
            // Position at car
            hitEffect.style.left = `${carPosition}%`;
            hitEffect.style.top = '60%';
            hitEffect.style.transform = 'translate(-50%, -50%)';
            
            gameContainer.appendChild(hitEffect);
            
            // Remove after animation
            setTimeout(() => {
                if (hitEffect.parentNode) {
                    hitEffect.remove();
                }
            }, 500);
        }
        
        // Handle button-based movement
        function handleButtonMovement() {
            if (moveLeft) {
                moveCar('left');
            }
            if (moveRight) {
                moveCar('right');
            }
        }
        
        // Create a new target
        function createTarget() {
            if (!gameActive) return;
            
            const target = document.createElement('div');
            target.className = 'target';
            
            // Random horizontal position (10% to 90%)
            const leftPos = Math.floor(Math.random() * 80) + 10;
            target.style.left = `${leftPos}%`;
            
            // Start from top
            target.style.top = '-70px';
            
            gameContainer.appendChild(target);
            
            // Store target info
            const targetObj = {
                element: target,
                left: leftPos,
                top: -70,
                hit: false
            };
            
            targets.push(targetObj);
        }
        
        // Move targets down the road
        function moveTargets() {
            if (!gameActive) return;
            
            for (let i = targets.length - 1; i >= 0; i--) {
                const target = targets[i];
                
                // Skip if already hit
                if (target.hit) continue;
                
                // Move target down with current speed
                target.top += 2 * currentSpeed;
                target.element.style.top = `${target.top}px`;
                
                // Check if target is off screen
                if (target.top > 500) {
                    target.element.remove();
                    targets.splice(i, 1);
                    continue;
                }
                
                // Check for collision with car
                if (checkCollision(target)) {
                    hitTarget(target);
                }
            }
        }
        
        // Check if car collides with target
        function checkCollision(target) {
            // Car boundaries (approximate)
            const carLeft = carPosition - 4;
            const carRight = carPosition + 4;
            const carTop = 350; // Car is at bottom of screen
            
            // Target boundaries
            const targetLeft = target.left - 3.5;
            const targetRight = target.left + 3.5;
            const targetBottom = target.top + 70;
            
            // Check if target is in car's vertical range and horizontally aligned
            return targetBottom >= carTop && 
                   targetLeft <= carRight && 
                   targetRight >= carLeft;
        }
        
        // Handle target hit
        function hitTarget(target) {
            if (target.hit) return;
            
            target.hit = true;
            target.element.classList.add('hit');
            
            // Play hit sound
            if (effectsSoundEnabled) {
                hitSound.currentTime = 0;
                hitSound.play().catch(e => console.log("Hit sound error:", e));
            }
            
            // Create car hit effect
            createHitEffect();
            
            // Add car hit animation
            car.classList.add('car-hit');
            setTimeout(() => car.classList.remove('car-hit'), 300);
            
            // Play crash sound for car
            if (effectsSoundEnabled) {
                crashSound.currentTime = 0;
                crashSound.play().catch(e => console.log("Crash sound error:", e));
            }
            
            // Update score
            score += 10;
            scoreElement.textContent = score;
            scoreElement.classList.add('pulse');
            setTimeout(() => scoreElement.classList.remove('pulse'), 500);
            
            // Remove target after a delay
            setTimeout(() => {
                target.element.remove();
                const index = targets.indexOf(target);
                if (index > -1) {
                    targets.splice(index, 1);
                }
            }, 500);
        }
        
        // Animate road
        function animateRoad() {
            if (!gameActive) return;
            
            const lines = document.querySelectorAll('.road-line');
            lines.forEach(line => {
                let top = parseInt(line.style.top) || 0;
                top += 5 * currentSpeed;
                
                if (top > 500) {
                    top = -50;
                }
                
                line.style.top = `${top}px`;
            });
        }
        
        // Update engine sound based on speed
        function updateEngineSound() {
            if (!engineSoundEnabled || !engineSound) return;
            
            // Adjust playback rate based on game speed
            engineSound.playbackRate = 0.8 + (currentSpeed * 0.2);
            
            // Adjust volume based on movement
            engineSound.volume = carMoving ? 0.3 : 0.1;
        }
        
        // Increase game speed over time
        function increaseSpeed() {
            if (!gameActive) return;
            
            // Increase speed progress
            speedProgress += speedIncreaseRate;
            
            // Calculate new speed
            if (speedProgress >= 100 && currentSpeed < maxSpeed) {
                currentSpeed += 0.5;
                speedProgress = 0;
                
                // Update speed display
                speedLevelElement.textContent = currentSpeed.toFixed(1);
                speedLevelElement.classList.add('pulse');
                setTimeout(() => speedLevelElement.classList.remove('pulse'), 500);
            }
            
            // Update progress bar
            const progressPercent = Math.min(100, (currentSpeed - 1) / (maxSpeed - 1) * 100 + speedProgress);
            speedFillElement.style.width = `${progressPercent}%`;
            speedPercentElement.textContent = `${Math.round(progressPercent)}%`;
        }
        
        // Start the game
        function startGame() {
            // Reset game state
            score = 0;
            scoreElement.textContent = score;
            gameActive = true;
            carPosition = 50;
            car.style.left = '50%';
            carMoving = false;
            
            // Reset car tilt
            car.classList.remove('car-tilt-left', 'car-tilt-right');
            
            // Reset speed
            currentSpeed = 1;
            speedProgress = 0;
            speedLevelElement.textContent = currentSpeed.toFixed(1);
            speedFillElement.style.width = '0%';
            speedPercentElement.textContent = '0%';
            
            // Clear any existing targets
            targets.forEach(target => target.element.remove());
            targets = [];
            
            // Clear exhaust container
            exhaustContainer.innerHTML = '';
            
            // Hide game over screen
            gameOverScreen.classList.add('hidden');
            
            // Create road markings
            createRoadMarkings();
            
            // Start game timers
            targetSpawnInterval = setInterval(createTarget, 1000);
            gameTimer = setTimeout(endGame, 600000); // 600 seconds
            
            // Start speed increase interval
            speedIncreaseInterval = setInterval(increaseSpeed, 100);
            
            // Start exhaust particle interval
            exhaustInterval = setInterval(createExhaust, 150);
            
            // Start animation loop
            roadAnimation = setInterval(() => {
                animateRoad();
                moveTargets();
                handleButtonMovement();
                updateEngineSound();
                
                // Reset car moving flag if no movement
                if (!moveLeft && !moveRight) {
                    carMoving = false;
                }
            }, 30);
            
            // Start engine sound
            if (engineSoundEnabled) {
                engineSound.currentTime = 0;
                engineSound.play().catch(e => console.log("Engine sound error:", e));
            }
            
            // Hide start button
            startBtn.textContent = 'Restart Game';
        }
        
        // End the game
        function endGame() {
            gameActive = false;
            clearInterval(targetSpawnInterval);
            clearInterval(roadAnimation);
            clearInterval(speedIncreaseInterval);
            clearInterval(exhaustInterval);
            clearTimeout(gameTimer);
            
            // Stop engine sound
            if (engineSound) {
                engineSound.pause();
            }
            
            // Show game over screen
            finalScoreElement.textContent = score;
            maxSpeedElement.textContent = currentSpeed.toFixed(1);
            gameOverScreen.classList.remove('hidden');
        }
        
        // Toggle engine sound
        function toggleEngineSound() {
            engineSoundEnabled = !engineSoundEnabled;
            engineSoundBtn.textContent = `Engine Sound: ${engineSoundEnabled ? 'ON' : 'OFF'}`;
            engineSoundBtn.classList.toggle('muted', !engineSoundEnabled);
            
            if (engineSoundEnabled && gameActive) {
                engineSound.currentTime = 0;
                engineSound.play().catch(e => console.log("Engine sound error:", e));
            } else if (engineSound) {
                engineSound.pause();
            }
        }
        
        // Toggle effects sound
        function toggleEffectsSound() {
            effectsSoundEnabled = !effectsSoundEnabled;
            effectsSoundBtn.textContent = `Effects: ${effectsSoundEnabled ? 'ON' : 'OFF'}`;
            effectsSoundBtn.classList.toggle('muted', !effectsSoundEnabled);
        }
        
        // Event listeners for keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                moveCar('left');
                moveLeft = true;
            } else if (e.key === 'ArrowRight') {
                moveCar('right');
                moveRight = true;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') {
                moveLeft = false;
                car.classList.remove('car-tilt-left');
            } else if (e.key === 'ArrowRight') {
                moveRight = false;
                car.classList.remove('car-tilt-right');
            }
        });
        
        // Event listeners for control buttons
        leftBtn.addEventListener('touchstart', () => { moveLeft = true; });
        leftBtn.addEventListener('touchend', () => { moveLeft = false; });
        leftBtn.addEventListener('mousedown', () => { moveLeft = true; });
        leftBtn.addEventListener('mouseup', () => { moveLeft = false; });
        leftBtn.addEventListener('mouseleave', () => { moveLeft = false; });
        
        rightBtn.addEventListener('touchstart', () => { moveRight = true; });
        rightBtn.addEventListener('touchend', () => { moveRight = false; });
        rightBtn.addEventListener('mousedown', () => { moveRight = true; });
        rightBtn.addEventListener('mouseup', () => { moveRight = false; });
        rightBtn.addEventListener('mouseleave', () => { moveRight = false; });
        
        // Toggle controls visibility
        toggleControlsBtn.addEventListener('click', () => {
            document.body.classList.toggle('controls-visible');
            toggleControlsBtn.textContent = document.body.classList.contains('controls-visible') 
                ? 'Hide Controls' 
                : 'Show Controls';
        });
        
        // Sound control event listeners
        engineSoundBtn.addEventListener('click', toggleEngineSound);
        effectsSoundBtn.addEventListener('click', toggleEffectsSound);
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        // Initialize sounds
        initSounds();
        
        // Initialize road
        createRoadMarkings();
    </script>
</body>
</html>
